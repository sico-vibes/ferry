name: Beta release

on:
  push:
    branches:
      - main
      # Release branches run every gate (incl. the real update path) but never publish.
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'

permissions:
  contents: write

concurrency:
  group: ferry-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-beta:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-msvc-node-gyp
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm check
        env:
          TURBO_CONCURRENCY: 2
      - name: UI invariants (layout and accessibility on key screens)
        shell: pwsh
        run: |
          pnpm --filter @ferry/desktop exec playwright install chromium
          pnpm --filter @ferry/desktop ui:invariants
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Upload UI invariant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-invariants
          path: apps/desktop/ui-invariants/
          if-no-files-found: ignore
      - name: Stamp and package beta
        shell: pwsh
        run: |
          $version = node apps/desktop/scripts/beta-version.mjs $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FERRY_RELEASE_VERSION = $version
          "FERRY_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "FERRY_RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          pnpm --filter @ferry/desktop dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run packaged golden-path E2E
        run: node apps/desktop/scripts/e2e-real-domains.mjs
        env:
          FERRY_E2E_ONLY: golden-path
          FERRY_E2E_EXECUTABLE: apps/desktop/release/win-unpacked/Ferry.exe
      - name: Run installed interactive CLI smoke
        # Runs with the runner's CI=true on purpose: the interactive CLI must still draw its chat.
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP ("ferry-cli-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:FERRY_SMOKE_CLI = (Resolve-Path 'apps\desktop\release\win-unpacked\resources\cli\ferry.cmd').Path
          $env:FERRY_SMOKE_EXECUTABLE = (Resolve-Path 'apps\desktop\release\win-unpacked\Ferry.exe').Path
          $env:FERRY_SMOKE_DATA_DIR = $data
          node --experimental-strip-types apps/desktop/scripts/cli-interactive-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run install and real update smoke
        run: node apps/desktop/scripts/install-smoke.mjs
      - name: Generate notes since the previous beta
        if: github.ref == 'refs/heads/main'
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const betaReleases = releases
              .filter((release) => /^v0\.9\.0-beta\.\d+$/.test(release.tag_name))
              .sort((left, right) => {
                const number = (tag) => Number(tag.match(/beta\.(\d+)$/)?.[1] ?? 0);
                return number(right.tag_name) - number(left.tag_name);
              });
            const previous = betaReleases[0]?.tag_name;
            const result = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.FERRY_RELEASE_TAG,
              ...(previous ? { previous_tag_name: previous } : {}),
            });
            core.setOutput('body', result.data.body);
      - name: Publish beta prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.FERRY_RELEASE_TAG }}
          name: Ferry ${{ env.FERRY_RELEASE_TAG }}
          prerelease: true
          draft: false
          make_latest: false
          body: ${{ steps.release-notes.outputs.body }}
          files: |
            apps/desktop/release/Ferry-Setup-*.exe
            apps/desktop/release/Ferry-*-portable.exe
            apps/desktop/release/beta.yml
            apps/desktop/release/*.blockmap
