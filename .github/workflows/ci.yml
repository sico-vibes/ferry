name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-node-gyp
      - run: pnpm install --frozen-lockfile
      - name: Check browser readiness and cleanup
        run: pnpm --filter @ferry/workspace exec vitest run test/page-check.test.ts test/page-check-navigation.test.ts test/page-check-readiness-qa.test.ts
      - name: Check Windows PowerShell Unicode and input handling
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: pnpm --filter @ferry/desktop exec vitest run src/main/powershell-utf8.test.ts
      - run: pnpm run check:tasks
      - if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit -p scripts/tsconfig.json
      - if: ${{ !cancelled() }}
        run: pnpm exec eslint --no-ignore scripts/eval-live.test.ts
      - if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config scripts/vitest.config.ts
      - if: ${{ !cancelled() }}
        run: node scripts/check-text.mjs
      - if: ${{ !cancelled() }}
        run: pnpm exec prettier --check .
      - if: ${{ !cancelled() }}
        run: pnpm bench:optimizers
      - if: ${{ !cancelled() }}
        run: pnpm --filter @ferry/desktop build
      - if: ${{ !cancelled() }}
        run: node apps/desktop/scripts/perf-budget-warn.mjs
