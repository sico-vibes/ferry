provider: cloudflare-workers-ai
name: Cloudflare Workers AI
tag: legit
optional: true
signup_url: https://dash.cloudflare.com/
docs_url: https://developers.cloudflare.com/workers-ai/platform/pricing/
terms_note: >-
  Free allocation is 10,000 Neurons/day, reset at 00:00 UTC. Text generation defaults to
  300 RPM. Some models require a paid billing method; see free_plan.excluded_models.
data_use: >-
  Cloudflare does not use Customer Content to train AI models without explicit consent.
verified_at: '2026-09-25'
source_url: https://developers.cloudflare.com/workers-ai/platform/pricing/
free_plan:
  source_url: https://developers.cloudflare.com/workers-ai/platform/pricing/
  models: ['*']
  excluded_models:
    - '@cf/moonshotai/kimi-k2.6'
    - '@cf/moonshotai/kimi-k2.7-code'
    - '@cf/zai-org/glm-5.2'
    - '@cf/zai-org/glm-5.3'
    - '@cf/zai-org/glm-5.3-flash'
    - '@cf/deepseek-ai/deepseek-v4-flash-0731'
    - '@cf/deepseek-ai/deepseek-v4-pro-0813'
endpoints: ['https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1']
required_headers: [Authorization]
probe_models: ['@cf/meta/llama-3.1-8b-instruct']
windows:
  - { scope: provider, metric: credits, kind: fixed_daily, tz: UTC, limit: 10000 }
  - { scope: provider, metric: requests, kind: rolling, length: 60, limit: 300 }
