  - { scope: model, model: gpt-oss-120b, metric: requests, kind: fixed_daily, tz: UTC, limit: 20 }
  - { scope: model, model: gpt-oss-120b, metric: tokens, kind: fixed_daily, tz: UTC, limit: 200000 }
