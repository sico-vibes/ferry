provider: gemini
name: Google Gemini API
tag: legit
signup_url: https://aistudio.google.com/
docs_url: https://ai.google.dev/gemini-api/docs/rate-limits
terms_note: Free-tier API model availability is model-specific; see the sourced free_plan coverage.
data_use: Requests may be used to improve Google products on unpaid tier.
data_use_training: true
verified_at: '2026-09-23'
source_url: https://ai.google.dev/gemini-api/docs/rate-limits
free_plan:
  source_url: https://ai.google.dev/gemini-api/docs/pricing
  models:
    - gemini-flash-latest
    - gemini-flash-lite-latest
    - gemini-3.8-flash
    - gemini-3.8-flash-tts
    - gemini-3.8-live*
    - gemini-3.5-flash*
    - gemini-3.5-live-translate-preview
    - gemini-3.5-transcribe*
    - gemini-3.1-flash-lite*
    - gemini-3.1-flash-live-preview
    - gemini-3-flash-preview
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    - gemini-2.5-flash-preview-tts
    - gemini-2.5-pro
    - gemini-embedding-2
    - gemma-4-*
  excluded_models:
    - gemini-3.1-flash-lite-image
    - gemini-3.1-flash-lite-image-preview
parser: gemini_retry_info
probe_models:
  - gemini-3.8-flash
  - gemini-flash-latest
windows:
  - {
      scope: model,
      model: 'gemini-*flash*',
      metric: requests,
      kind: fixed_daily,
      tz: America/Los_Angeles,
      limit: 250,
    }
  - {
      scope: model,
      model: 'gemini-*flash*',
      metric: requests,
      kind: rolling,
      length: 60,
      limit: 10,
    }
