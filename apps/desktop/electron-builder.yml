appId: dev.ferry.app
productName: Ferry
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Ferry
linux:
  icon: build/icon.png
mac:
  icon: build/icon.png
