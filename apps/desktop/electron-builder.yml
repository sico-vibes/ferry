appId: dev.ferry.app
productName: Ferry
publish:
  provider: github
  owner: sico-vibes
  repo: ferry
  releaseType: draft
  channel: latest
directories:
  buildResources: build
  output: release
files:
  - out/**
  - out/main/migrations/**
  - '!out/cli/**'
  - package.json
  - '!out/web/**'
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.md'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/__tests__/**'
  - '!**/prebuilds/darwin-*.node'
  - '!**/prebuilds/linux-*.node'
  - '!**/prebuilds/linuxmusl-*.node'
  - '!**/prebuilds/win32-arm64.node'
  - '!**/prebuilds/win32-ia32.node'
  - '!**/prebuilds/win32-arm64/**'
  - '!**/prebuilds/win32-ia32/**'
  - '!**/third_party/**/win10-arm64/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/**/README*'
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
  - '!node_modules/**/__tests__/**'
  - '!node_modules/**/*.test.*'
  - '!node_modules/**/*.spec.*'
  - out/data/vendor/SOURCES.md
  - '!node_modules/better-sqlite3/prebuilds/darwin-*.node'
  - '!node_modules/better-sqlite3/prebuilds/linux-*.node'
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/node-pty/prebuilds/darwin-*/**'
  - '!node_modules/node-pty/prebuilds/linux-*/**'
  - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!node_modules/node-pty/third_party/**/win10-arm64/**'
  - '!node_modules/better-sqlite3/build/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/node-pty/build/**'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/third_party/**'
  - '!node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-bash.wasm'
  - '!node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-css.wasm'
  - '!node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-ini.wasm'
  - '!node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-powershell.wasm'
  - '!node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-regex.wasm'
asar: true
extraResources:
  - from: out/cli
    to: cli
electronLanguages:
  - en-US
npmRebuild: false
afterPack: scripts/after-pack.mjs
asarUnpack:
  - 'out/main/migrations/**'
  - '**/*.node'
  - '**/@vscode/tree-sitter-wasm/wasm/*.wasm'
  - '**/bin/rg.exe'
  - '**/node-pty/**/winpty-agent.exe'
  - '**/node-pty/**/winpty.dll'
  - '**/node-pty/**/conpty/**'
  - 'cli/**/*.node'
electronDist: node_modules/electron/dist
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
    - portable
  artifactName: Ferry-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Ferry
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Ferry-Setup-${version}.${ext}
  include: nsis/installer.nsh
portable:
  artifactName: Ferry-${version}-portable.${ext}
linux:
  icon: build/icon.png
mac:
  icon: build/icon.png
