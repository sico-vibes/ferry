appId: dev.ferry.app
productName: Ferry
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
asarUnpack:
  - '**/*.node'
  - '**/node-pty/**/winpty-agent.exe'
  - '**/node-pty/**/winpty.dll'
  - '**/node-pty/**/conpty/**'
electronDist: node_modules/electron/dist
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
    - portable
  artifactName: Ferry-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Ferry
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Ferry-Setup-${version}.${ext}
  include: nsis/installer.nsh
portable:
  artifactName: Ferry-${version}-portable.${ext}
linux:
  icon: build/icon.png
mac:
  icon: build/icon.png
