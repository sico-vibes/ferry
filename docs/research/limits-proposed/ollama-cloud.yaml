terms_note: >-
  Free plan is $0 and includes a starter amount of usage credits for a smaller set of
  starter models; usage resets monthly from the signup date. Buying credits unlocks all
  models. Free concurrency is 1 request. The starter credit amount is not published.
data_use: >-
  Prompt or response data is never logged or trained on; Ollama requires no-logging,
  no-training, zero-retention policies from hosting partners.
